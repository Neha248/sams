services:
  sams:
    build:
      context: .
    container_name: sams-tanstack
    environment:
      HOST: 0.0.0.0
      NODE_ENV: development
      PORT: 3000
    ports:
      - "${SAMS_PORT:-3000}:3000"
    volumes:
      - sams-data:/app/data
    develop:
      watch:
        - action: sync
          path: ./src
          target: /app/src
        - action: sync
          path: ./biome.json
          target: /app/biome.json
        - action: sync
          path: ./tsconfig.json
          target: /app/tsconfig.json
        - action: sync
          path: ./vite.config.ts
          target: /app/vite.config.ts
        - action: rebuild
          path: ./Dockerfile
        - action: rebuild
          path: ./.npmrc
        - action: rebuild
          path: ./package.json
        - action: rebuild
          path: ./package-lock.json
    restart: unless-stopped

volumes:
  sams-data:
